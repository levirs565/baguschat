[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres" ] }
dotenvy = "0.15"
serde = "1.0.228"
serde_json = "1.0.145"
base64 = "0.22.1"
srp = { git = "https://github.com/levirs565/PAKEs.git" }
blake2 = "0.10"
rand = { version = "0.9.2", features = ["small_rng"] }
actix-session = {version = "0.11.0",  features = ["redis-session"] }
actix-cors = "0.7.1"
sha2 = "0.10.9"
hex = "0.4.3"
num-bigint = "0.4.6"
